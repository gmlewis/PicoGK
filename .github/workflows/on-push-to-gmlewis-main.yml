name: On Push to gmlewis-main

on:
  push:
    branches: [gmlewis-main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go-tests:
    name: Go Unit Tests (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        package:
          - sdk/go/picogk
          - sdk/go/blender
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run Go tests
        working-directory: ${{ matrix.package }}
        run: go test -v -count=1 ./...

  # picogkffi/picogkshapes (Go) require cgo + libpicogk — tested locally
  # picogkffi/picogkshapes/picogkffi/test (MoonBit) require -lpicogk — tested locally
  # picogk (MoonBit) requires moonbitlang/async process spawn — tested locally
