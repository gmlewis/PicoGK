name: On Push to gmlewis-main

on:
  push:
    branches: [gmlewis-main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go-tests:
    name: Go Unit Tests (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        package:
          - sdk/go/picogk
          - sdk/go/blender
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run Go tests
        working-directory: ${{ matrix.package }}
        run: go test -v -count=1 ./...

  moonbit-check:
    name: MoonBit Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          curl -fsSL https://moonbitlang.com/download.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Moon version
        run: moon version

      - name: Type check all MoonBit packages
        working-directory: sdk/mbt
        run: moon check --target native

      - name: Type check wasm-gc target
        working-directory: sdk/mbt
        run: moon check --target wasm-gc || true

  # picogkffi/picogkshapes (Go) require cgo + libpicogk — tested locally
  # picogkffi/picogkshapes/picogkffi/test (MoonBit) require -lpicogk — tested locally
  # picogk (MoonBit) requires moonbitlang/async process spawn — tested locally
  # MoonBit examples (hello-picogk, fields-and-io, etc.) require libpicogk — tested locally