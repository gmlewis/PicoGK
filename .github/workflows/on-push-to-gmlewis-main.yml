name: On Push to gmlewis-main

on:
  push:
    branches: [gmlewis-main]

concurrency:
  group: ${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go-check:
    name: Go Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: go vet (picogk MCP SDK)
        working-directory: sdk/go/picogk
        run: go vet ./...

      - name: go vet (blender MCP SDK)
        working-directory: sdk/go/blender
        run: go vet ./...

      - name: go vet (picogkshapes)
        working-directory: sdk/go/picogkshapes
        run: go vet ./...

  moonbit-check:
    name: MoonBit Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          /bin/bash -c "$(curl -fsSL https://cli.moonbitlang.com/install/unix.sh)"
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Moon version
        run: moon version

      - name: Moon update
        run: moon update

      - name: Type check all MoonBit packages
        working-directory: sdk/mbt
        run: moon check --target native

      - name: Type check wasm-gc target
        working-directory: sdk/mbt
        run: moon check --target wasm-gc || true

  # FFI tests (Go picogkffi, MoonBit picogkffi/test) require the native
  # PicoGK library and are run locally via: ./scripts/test-all.sh
  #
  # Gossamer tests that don't need native lib:
  #   sdk/gos/picogk (expand_path, resolve_path)
  #   sdk/gos/blender (expand_path)
  # Run locally via: ./scripts/test-all.sh
