name: On Push to gmlewis-main

on:
  push:
    branches: [gmlewis-main]

jobs:
  go-tests:
    name: Go Unit Tests (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - sdk/go/picogk
          - sdk/go/blender
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run Go tests
        working-directory: ${{ matrix.package }}
        run: go test -v -count=1 ./...

  # picogkffi and picogkshapes require cgo + libpicogk which is not available in CI
  # They are tested locally via the smoke test and ffi_test.go

  moonbit-tests:
    name: MoonBit Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Run MoonBit tests
        working-directory: sdk/mbt
        run: moon test --target native
