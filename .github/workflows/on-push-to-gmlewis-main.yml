name: On Push to gmlewis-main

on:
  push:
    branches: [gmlewis-main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go-tests:
    name: Go Unit Tests (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        package:
          - sdk/go/picogk
          - sdk/go/blender
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run Go tests
        working-directory: ${{ matrix.package }}
        run: go test -v -count=1 ./...

  # picogkffi and picogkshapes require cgo + libpicogk which is not available in CI
  # They are tested locally via the smoke test and ffi_test.go

  moonbit-tests:
    name: MoonBit Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          /bin/bash -c "$(curl -fsSL https://cli.moonbitlang.com/install/unix.sh)"
          echo "/home/runner/.moon/bin" >> $GITHUB_PATH

      - name: Moon version
        run: moon version --all

      - name: moon update
        working-directory: sdk/mbt
        run: moon update

      - name: moon check
        working-directory: sdk/mbt
        run: moon check --target native picogkffi picogkshapes

      - name: moon test
        working-directory: sdk/mbt
        run: moon test --target native picogkffi picogkffi/test picogkshapes
